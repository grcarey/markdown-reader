<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, system-ui, sans-serif; padding: 8px; }
  img { max-width: 100%; height: auto; }
  pre { white-space: pre-wrap; }
  .mermaid-error { color: crimson; }
  table { border-collapse: collapse; margin: 1em 0; }
  th, td { border: 2px solid color-mix(in srgb, currentColor 40%, transparent); padding: 6px 12px; }
</style>
<script src="marked.min.js"></script>
<script src="mermaid.min.js"></script>
</head>
<body></body>
<script>
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: dark ? 'dark' : 'default' });

  // In-page #anchors scroll as normal; every other link goes to Swift to open.
  document.addEventListener('click', e => {
    const a = e.target.closest('a[href]');
    if (!a || a.getAttribute('href').startsWith('#')) return;
    e.preventDefault();
    webkit.messageHandlers.link.postMessage(a.getAttribute('href'));
  });

  // Scroll sync with the editor, in pixels (Swift maps between the panes by heading). Events within 150 ms of our own scroll are ignored.
  let lastSync = 0, pending = false, source = '';
  const maxY = () => document.documentElement.scrollHeight - innerHeight;
  function syncTo(y) {
    lastSync = Date.now();
    scrollTo(0, y);
  }

  // Heading anchors for Swift: source line (from marked's own tokens) and page y of each heading, paired in order.
  // ponytail: top-level headings only; ones nested in lists or blockquotes are ignored. A count mismatch (raw HTML headings) sends none, so sync falls back to proportional.
  function postAnchors() {
    const lines = [];
    let line = 0;
    for (const t of marked.lexer(source)) {
      if (t.type === 'heading') lines.push(line);
      line += (t.raw.match(/\n/g) || []).length;
    }
    const hs = [...document.body.children].filter(e => /^H[1-6]$/.test(e.tagName));
    const ok = hs.length === lines.length;
    webkit.messageHandlers.anchors.postMessage({
      lines: ok ? lines : [],
      ys: ok ? hs.map(h => h.getBoundingClientRect().top + scrollY) : [],
      max: Math.max(maxY(), 0)
    });
  }
  addEventListener('resize', postAnchors);
  // Images and diagrams settle after render and move later headings, so re-post whenever the content's size changes.
  new ResizeObserver(postAnchors).observe(document.body);
  addEventListener('scroll', () => {
    if (pending || Date.now() - lastSync < 150) return;
    pending = true;
    requestAnimationFrame(() => {
      pending = false;
      webkit.messageHandlers.scroll.postMessage(Math.min(Math.max(scrollY, 0), Math.max(maxY(), 0)));
    });
  });

  async function render(md, size) {
    // Replacing the body collapses the page, so put the scroll position back afterwards.
    const y = scrollY;
    const restore = () => { lastSync = Date.now(); scrollTo(0, y); };
    source = md;
    document.body.style.fontSize = size + 'px';
    // ponytail: marked does not sanitise raw HTML in the markdown; fine for a local reader, add DOMPurify if untrusted files matter
    document.body.innerHTML = marked.parse(md);
    restore();
    // GitHub-style heading ids so #section links have a target.
    document.querySelectorAll('h1,h2,h3,h4,h5,h6').forEach(h => {
      h.id = h.textContent.trim().toLowerCase().replace(/[^\w\- ]/g, '').replace(/ /g, '-');
    });
    const blocks = document.querySelectorAll('pre > code.language-mermaid');
    const nodes = [];
    blocks.forEach(code => {
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = code.textContent;
      code.parentElement.replaceWith(div);
      nodes.push(div);
    });
    // Run per diagram so one syntax error leaves the rest (and the raw block) intact.
    for (const n of nodes) {
      const src = n.textContent;
      try {
        await mermaid.run({ nodes: [n] });
      } catch (e) {
        n.className = 'mermaid-error';
        n.innerHTML = '<pre></pre><div></div>';
        n.firstChild.textContent = src;
        n.lastChild.textContent = String(e && e.message || e);
      }
    }
    restore();
    postAnchors();
  }
</script>
</html>
